    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Filter benign Vite WebSocket disconnection messages in dev environments
      const _origConsoleError = console.error;
      console.error = function (...args) {
        if (typeof args[0] === 'string' && (args[0].includes('WebSocket') || args[0].includes('vite-hmr'))) {
          return;
        }
        _origConsoleError.apply(console, args);
      };
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.preventDefault();
        }
      }, true);
    </script>
    <title>FracTutor: Fracciones sin Ansiedad</title>
