<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer circle representation of a whole -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="24" />
  
  <!-- 3/4 filled segments in emerald / warm white -->
  <path d="M 256 96 A 160 160 0 1 1 96 256 L 256 256 Z" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Distinctive 1/4 slice in warm orange -->
  <path d="M 256 96 A 160 160 0 0 1 416 256 L 256 256 Z" fill="url(#accent)" />
  
  <!-- Central dividing line / core indicator -->
  <circle cx="256" cy="256" r="32" fill="#047857" stroke="#FFFFFF" stroke-width="12" />
  
  <!-- Subtle fraction bar symbol overlay -->
  <rect x="156" y="380" width="200" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
</svg>
